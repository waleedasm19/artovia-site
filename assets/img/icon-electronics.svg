<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" xmlns:c2pa="http://c2pa.org/manifest">
 <defs>
  <style>
   .ol{stroke:#4A3826;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
   .tr{stroke:#4A3826;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
 </defs>
 <!-- circuit traces radiating to terminal dots (emblem's dots) -->
 <g class="tr">
  <path d="M150 110 V70 H110"/> <path d="M200 110 V40"/> <path d="M250 110 V70 H290"/>
  <path d="M150 290 V330 H110"/> <path d="M200 290 V360"/> <path d="M250 290 V330 H290"/>
  <path d="M110 150 H70 V110"/> <path d="M110 200 H40"/> <path d="M110 250 H70 V290"/>
  <path d="M290 150 H330 V110"/> <path d="M290 200 H360"/> <path d="M290 250 H330 V290"/>
 </g>
 <g fill="#2B2118" class="ol">
  <circle cx="110" cy="70" r="11"/><circle cx="200" cy="40" r="13"/><circle cx="290" cy="70" r="11"/>
  <circle cx="110" cy="330" r="11"/><circle cx="200" cy="360" r="13"/><circle cx="290" cy="330" r="11"/>
  <circle cx="70" cy="110" r="11"/><circle cx="40" cy="200" r="13"/><circle cx="70" cy="290" r="11"/>
  <circle cx="330" cy="110" r="11"/><circle cx="360" cy="200" r="13"/><circle cx="330" cy="290" r="11"/>
 </g>
 <!-- pins -->
 <g fill="#E9B949" class="ol">
  <rect x="140" y="92" width="20" height="24" rx="3"/><rect x="190" y="92" width="20" height="24" rx="3"/><rect x="240" y="92" width="20" height="24" rx="3"/>
  <rect x="140" y="284" width="20" height="24" rx="3"/><rect x="190" y="284" width="20" height="24" rx="3"/><rect x="240" y="284" width="20" height="24" rx="3"/>
  <rect x="92" y="140" width="24" height="20" rx="3"/><rect x="92" y="190" width="24" height="20" rx="3"/><rect x="92" y="240" width="24" height="20" rx="3"/>
  <rect x="284" y="140" width="24" height="20" rx="3"/><rect x="284" y="190" width="24" height="20" rx="3"/><rect x="284" y="240" width="24" height="20" rx="3"/>
 </g>
 <!-- chip body: brown frame + teal -->
 <rect x="112" y="112" width="176" height="176" rx="10" fill="#A88458" class="ol"/>
 <rect x="128" y="128" width="144" height="144" rx="6" fill="#3E9C82" class="ol"/>
 <!-- four tri-colour corner triangles echoing the emblem -->
 <path d="M128 128 h34 l-34 34z" fill="#C8505A" class="ol"/>
 <path d="M272 128 h-34 l34 34z" fill="#4A64B0" class="ol"/>
 <path d="M128 272 h34 l-34 -34z" fill="#4A64B0" class="ol"/>
 <path d="M272 272 h-34 l34 -34z" fill="#C8505A" class="ol"/>
 <!-- sun / spark at the core -->
 <g transform="translate(200 200)">
  <path fill="#F2C230" class="ol" d="M0,-58 L9,-30 L29,-50 L26,-22 L52,-28 L36,-6 L58,6 L32,14 L46,38 L20,30 L16,58 L0,36 L-16,58 L-20,30 L-46,38 L-32,14 L-58,6 L-36,-6 L-52,-28 L-26,-22 L-29,-50 L-9,-30 Z"/>
  <circle r="24" fill="#F7D25A" class="ol"/>
 </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
