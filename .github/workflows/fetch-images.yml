# ينزّل الصور المرخّصة المطلوبة في data/commons-images.json على فروع العمل (للمعاينة قبل الدمج).
name: جلب الصور المرخّصة
on:
  push: { branches: ["claude/**"], paths: ["data/commons-images.json"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/fetch_commons.py
      - run: |
          git config user.name "artovia-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/world.json data/world assets/img/world
          git diff --cached --quiet || (git commit -m "صور مرخّصة من ويكيميديا كومنز" && git push)
