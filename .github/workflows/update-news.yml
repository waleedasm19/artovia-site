# يحدّث أخبار العلوم كل ساعتين وينشر الموقع على GitHub Pages.
name: تحديث الأخبار ونشر الموقع
on:
  schedule: [{ cron: "17 */6 * * *" }]
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: جلب الأخبار
        env: { DEEPL_API_KEY: "${{ secrets.DEEPL_API_KEY }}" }
        run: python3 tools/fetch_news.py
      - name: حفظ الأخبار في المستودع
        run: |
          git config user.name "artovia-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news-queue.json
          git diff --cached --quiet || (git commit -m "تحديث الأخبار" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
